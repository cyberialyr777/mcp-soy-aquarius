[project]
name = "soyaquarius-mcp"
version = "0.1.0"
description = "MCP server connecting Claude with Odoo 18 Community for SoyAquarius Naturista"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.9.0,<2",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "openpyxl>=3.1.0",
]

[project.scripts]
soyaquarius-mcp = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
